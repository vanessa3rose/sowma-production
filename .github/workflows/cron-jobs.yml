name: Run Cron Jobs

on:
  schedule:
    - cron: "0 0 * * *" # token refresh
    - cron: "0 2 * * *" # social media sync
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE_URL: ${{ secrets.BASE_URL }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_PAGE_ID: ${{ secrets.INSTAGRAM_BUSINESS_PAGE_ID }}
      GA_TYPE: ${{ secrets.GA_TYPE }}
      GA_PROJECT_ID: ${{ secrets.GA_PROJECT_ID }}
      GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}
      GA_CLIENT_EMAIL: ${{ secrets.GA_CLIENT_EMAIL }}
      GA_CLIENT_ID: ${{ secrets.GA_CLIENT_ID }}
      GA_AUTH_URI: ${{ secrets.GA_AUTH_URI }}
      GA_TOKEN_URI: ${{ secrets.GA_TOKEN_URI }}
      GA_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.GA_AUTH_PROVIDER_X509_CERT_URL }}
      GA_CLIENT_X509_CERT_URL: ${{ secrets.GA_CLIENT_X509_CERT_URL }}
      GA_UNIVERSE_DOMAIN: ${{ secrets.GA_UNIVERSE_DOMAIN }}
      CONSTANT_CONTACT_CLIENT_ID: ${{ secrets.CONSTANT_CONTACT_CLIENT_ID }}
      CONSTANT_CONTACT_CLIENT_SECRET: ${{ secrets.CONSTANT_CONTACT_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Call token cron
        run: |
          echo "Running token refresh..."
          RESPONSE=$(curl -L -v -H "Authorization: Bearer $CRON_SECRET" "https://sowma-production.vercel.app/api/cron/token")
          echo "Response: $RESPONSE"

      - name: Call social media cron
        run: |
          echo "Running social media sync..."
          RESPONSE=$(curl -L -v -H "Authorization: Bearer $CRON_SECRET" "https://sowma-production.vercel.app/api/cron/social-media")
          echo "Response: $RESPONSE"
