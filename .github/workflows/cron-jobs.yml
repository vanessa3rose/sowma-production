name: Run Cron Jobs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE_URL: https://pulse.sowma.org

      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_PAGE_ID: ${{ secrets.INSTAGRAM_BUSINESS_PAGE_ID }}

      GA_TYPE: ${{ secrets.GA_TYPE }}
      GA_PROJECT_ID: ${{ secrets.GA_PROJECT_ID }}
      GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}
      GA_PRIVATE_KEY_ID: ${{ secrets.GA_PRIVATE_KEY_ID }}
      GA_CLIENT_EMAIL: ${{ secrets.GA_CLIENT_EMAIL }}
      GA_CLIENT_ID: ${{ secrets.GA_CLIENT_ID }}
      GA_AUTH_URI: ${{ secrets.GA_AUTH_URI }}
      GA_TOKEN_URI: ${{ secrets.GA_TOKEN_URI }}
      GA_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.GA_AUTH_PROVIDER_X509_CERT_URL }}
      GA_CLIENT_X509_CERT_URL: ${{ secrets.GA_CLIENT_X509_CERT_URL }}
      GA_UNIVERSE_DOMAIN: ${{ secrets.GA_UNIVERSE_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug secret length
        run: |
          echo "CRON_SECRET length: ${#CRON_SECRET}"

      - name: Call token cron
        run: |
          echo "Running token refresh..."
          curl -fsSL \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/token"

      - name: Call social media cron
        run: |
          echo "Running social media sync..."
          curl -fsSL \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/social-media"
